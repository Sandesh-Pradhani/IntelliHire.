name: IntelliHire CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build client
        working-directory: client
        run: npm ci && npm run build
      - name: Verify server syntax
        run: node --check server/server.js && node --check server/routes/organizationRoutes.js && node --check server/services/companyIntelligenceService.js
